name: Ejecutar pruebas Maderas MyM

# Ejecución manual: pestaña Actions > "Ejecutar pruebas Maderas MyM" > Run workflow.
# Al terminar, descargue el artefacto "resultados-pruebas" (capturas, JSON, reportes HTML y planilla).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HEADLESS: "true"
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Versión de Chrome y chromedriver del runner
        run: |
          google-chrome --version | tee entorno.txt
          echo "chromedriver: $($CHROMEWEBDRIVER/chromedriver --version)" | tee -a entorno.txt
          echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          echo "Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a entorno.txt

      - name: Probar si el sitio responde desde este servidor
        run: |
          code=$(curl -s -o /dev/null -L -m 40 -w "%{http_code}" https://www.maderasmym.cl/ || true)
          echo "Respuesta HTTP de www.maderasmym.cl: ${code:-sin respuesta}" | tee -a entorno.txt
        continue-on-error: true

      - name: Ejecutar los 15 Runner (mvn clean verify)
        run: mvn -B clean verify
        continue-on-error: true

      - name: Procesar resultados (planilla + resumen JSON)
        if: always()
        run: |
          pip install openpyxl
          python herramientas/procesar_resultados.py --resumen-json resumen_resultados.json | tee procesamiento.txt

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            evidencias/
            target/cucumber-json/
            target/cucumber-reports/
            target/cucumber-report-html/
            target/cucumber-results/
            target/surefire-reports/
            planilla/Planilla_Escenarios_Resultados_MaderasMyM.xlsx
            resumen_resultados.json
            entorno.txt
            procesamiento.txt
          if-no-files-found: warn

      - name: Guardar los resultados en el repositorio (carpeta resultados-ejecucion)
        if: always()
        run: |
          rm -rf resultados-ejecucion
          mkdir -p resultados-ejecucion
          cp -r evidencias resultados-ejecucion/ 2>/dev/null || true
          mkdir -p resultados-ejecucion/cucumber-json
          cp target/cucumber-json/*.json resultados-ejecucion/cucumber-json/ 2>/dev/null || true
          cp resumen_resultados.json entorno.txt procesamiento.txt resultados-ejecucion/ 2>/dev/null || true
          cp planilla/Planilla_Escenarios_Resultados_MaderasMyM.xlsx resultados-ejecucion/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f resultados-ejecucion
          git commit -m "Resultados de la ejecución" || echo "nada que guardar"
          git pull --rebase || true
          git push
